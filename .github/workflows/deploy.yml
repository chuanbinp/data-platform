name: Test and deploy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test-password@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.9
          uv sync --locked --extra dev --extra dashboard --group dbt --no-default-groups
      - name: Run tests
        run: |
          docker compose version
          uv run --no-sync pytest -q
      - name: Check deployment script syntax
        run: |
          for script in docker/*.sh; do bash -n "$script"; done

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: hpml-cp3541
      VM_NAME: data-platform
      VM_ZONE: us-east1-c
      REGISTRY: us-east1-docker.pkg.dev
      IMAGE_PREFIX: us-east1-docker.pkg.dev/hpml-cp3541/data-platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-deployer@hpml-cp3541.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate Docker
        run: gcloud auth configure-docker "$REGISTRY" --quiet
      - name: Set release name
        run: echo "RELEASE=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
      - name: Build Airflow and dbt
        id: airflow
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.airflow
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/airflow:${{ env.RELEASE }}
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,mode=max,scope=airflow
      - name: Test DAG inside Airflow image
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/airflow@${{ steps.airflow.outputs.digest }}
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/tests:/opt/airflow/tests:ro" "$IMAGE" \
            -m unittest discover -s /opt/airflow/tests -p test_airflow_dag.py
      - name: Build dashboard
        id: dashboard
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.dashboard
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/dashboard:${{ env.RELEASE }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
      - name: Package deployment files
        env:
          AIRFLOW_DIGEST: ${{ steps.airflow.outputs.digest }}
          DASHBOARD_DIGEST: ${{ steps.dashboard.outputs.digest }}
        run: |
          printf 'AIRFLOW_IMAGE=%s/airflow@%s\nDASHBOARD_IMAGE=%s/dashboard@%s\n' \
            "$IMAGE_PREFIX" "$AIRFLOW_DIGEST" "$IMAGE_PREFIX" "$DASHBOARD_DIGEST" > images.env
          tar -czf release.tar.gz compose.yaml compose.production.yaml images.env \
            docker/deploy.sh docker/postgres-entrypoint.sh
      - name: Transfer release through IAP
        run: |
          gcloud compute scp release.tar.gz "$VM_NAME:release-$RELEASE.tar.gz" \
            --project "$PROJECT_ID" --zone "$VM_ZONE" --tunnel-through-iap --quiet
      - name: Deploy through IAP
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project "$PROJECT_ID" --zone "$VM_ZONE" --tunnel-through-iap --quiet \
            --command "
              set -eu
              sudo mkdir -p '/opt/data-platform/releases/$RELEASE'
              sudo tar --no-same-owner -xzf 'release-$RELEASE.tar.gz' -C '/opt/data-platform/releases/$RELEASE'
              rm 'release-$RELEASE.tar.gz'
              sudo bash '/opt/data-platform/releases/$RELEASE/docker/deploy.sh'
            "
