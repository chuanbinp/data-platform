x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Connection and schema settings contain no credentials.
x-database-environment: &database-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  DBT_BRONZE_SCHEMA: ${DBT_BRONZE_SCHEMA:-bronze}
  DBT_SILVER_SCHEMA: ${DBT_SILVER_SCHEMA:-silver}
  DBT_GOLD_SCHEMA: ${DBT_GOLD_SCHEMA:-gold}

# Ingestion and dbt share the warehouse writer account.
x-warehouse-environment: &warehouse-environment
  <<: *database-environment
  POSTGRES_USER: ${WAREHOUSE_USER:-warehouse_writer}
  POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD in .env}
  DBT_ENV_SECRET_POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD in .env}

x-airflow-common: &airflow-common
  build: &airflow-build
    context: .
    dockerfile: Dockerfile.airflow
  image: &airflow-image ${AIRFLOW_IMAGE:-data-platform-airflow:3.4.0}
  restart: unless-stopped
  logging: *logging
  environment: &airflow-environment
    <<: *warehouse-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${AIRFLOW_DB_USER:-airflow_user}@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-2}
    DBT_THREADS: ${DBT_THREADS:-2}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # libpq reads credentials separately, so passwords need no URL escaping.
    PGUSER: ${AIRFLOW_DB_USER:-airflow_user}
    PGPASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
    EIA_API_KEY: ${EIA_API_KEY:-}
  networks: [pipeline]
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/data-platform/src:ro
    - ./dbt:/opt/dbt:ro
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-dependencies
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

# Keep the dashboard connection separate from ingestion/admin credentials.
x-viewer-environment: &viewer-environment
  <<: *database-environment
  VIEWER_USER: ${VIEWER_USER:-warehouse_viewer}
  VIEWER_PASSWORD: ${VIEWER_PASSWORD:?Set VIEWER_PASSWORD in .env}

services:
  database-init:
    build: &dashboard-build
      context: .
      dockerfile: Dockerfile.dashboard
    image: &dashboard-image ${DASHBOARD_IMAGE:-data-platform-dashboard:local}
    restart: "no"
    command: ["python", "-m", "data_platform.database"]
    environment:
      <<: *database-environment
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-warehouse_writer}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:?Set WAREHOUSE_PASSWORD in .env}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow_user}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
      VIEWER_USER: ${VIEWER_USER:-warehouse_viewer}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?Set VIEWER_PASSWORD in .env}
    networks: [pipeline]
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: *dashboard-build
    image: *dashboard-image
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *viewer-environment
    networks: [explorer, warehouse]
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  dbt:
    build: *airflow-build
    image: *airflow-image
    profiles: ["dbt"]
    entrypoint: /opt/data-platform/.venv/bin/dbt
    command: build
    environment:
      <<: *warehouse-environment
      DBT_THREADS: ${DBT_THREADS:-2}
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
    networks: [pipeline]
    volumes:
      - ./dbt:/opt/dbt:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    entrypoint: ["sh", "/usr/local/bin/platform-postgres-entrypoint.sh"]
    networks: [pipeline, warehouse]
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-warehouse_writer}
      VIEWER_USER: ${VIEWER_USER:-warehouse_viewer}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER:-airflow_user}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5000}:5432"
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-entrypoint.sh:/usr/local/bin/platform-postgres-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: ["python", "/opt/airflow/airflow_init.py"]
    command: []
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    depends_on:
      database-init:
        condition: service_completed_successfully

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8000}:8080"
    healthcheck: &airflow-healthcheck
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-dependencies
      airflow-api-server:
        condition: service_healthy
    healthcheck:
      <<: *airflow-healthcheck
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$$HOSTNAME\""]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

volumes:
  warehouse_pgdata:
  airflow_logs:

networks:
  explorer:
  warehouse:
    internal: true
  pipeline:
