# Warehouse settings shared by Airflow tasks and manual dbt runs.
x-warehouse-environment: &warehouse-environment
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  DBT_ENV_SECRET_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  DBT_BRONZE_SCHEMA: ${DBT_BRONZE_SCHEMA:-bronze}
  DBT_SILVER_SCHEMA: ${DBT_SILVER_SCHEMA:-silver}
  DBT_GOLD_SCHEMA: ${DBT_GOLD_SCHEMA:-gold}

x-airflow-common: &airflow-common
  build: &airflow-build
    context: .
    dockerfile: Dockerfile.airflow
  image: &airflow-image data-platform-airflow:3.4.0
  restart: unless-stopped
  env_file: .env
  environment: &airflow-environment
    <<: *warehouse-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-local-airflow-jwt-secret-use-a-random-long-value-before-deployment}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # libpq reads credentials separately, so passwords need no URL escaping.
    PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/data-platform/src:ro
    - ./dbt:/opt/dbt:ro
    - airflow_logs:/opt/airflow/logs
  depends_on: &airflow-dependencies
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  dbt:
    build: *airflow-build
    image: *airflow-image
    profiles: ["dbt"]
    entrypoint: /opt/data-platform/.venv/bin/dbt
    command: build
    environment:
      <<: *warehouse-environment
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
    volumes:
      - ./dbt:/opt/dbt:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5000}:5432"
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    restart: "no"
    entrypoint: ["python", "/opt/airflow/airflow_init.py"]
    command: []
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change-me-local-development-only}
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8000}:8080"
    healthcheck: &airflow-healthcheck
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-dependencies
      airflow-api-server:
        condition: service_healthy
    healthcheck:
      <<: *airflow-healthcheck
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$$HOSTNAME\""]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

volumes:
  warehouse_pgdata:
  airflow_logs:
