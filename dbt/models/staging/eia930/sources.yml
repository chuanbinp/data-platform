version: 2

sources:
  - name: eia930
    schema: "{{ env_var('DBT_BRONZE_SCHEMA', 'bronze') }}"
    tables:
      - name: eia930_region_hourly_vintages
        description: Changed-only hourly regional observations, including all vintages.
        columns:
          - name: period
            data_tests: [not_null]
          - name: respondent
            data_tests: [not_null]
          - name: type
            data_tests: [not_null]
          - name: observed_at
            data_tests: [not_null]
          - name: inserted_at
            data_tests: [not_null]
          - name: ingestion_run_id
            data_tests: [not_null]
      - name: eia930_fuel_type_hourly_vintages
        description: Changed-only hourly generation by fuel, including all vintages.
        columns:
          - name: period
            data_tests: [not_null]
          - name: respondent
            data_tests: [not_null]
          - name: fueltype
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: "{{ var('fuel_columns').keys() | list }}"
          - name: observed_at
            data_tests: [not_null]
          - name: inserted_at
            data_tests: [not_null]
          - name: ingestion_run_id
            data_tests: [not_null]
