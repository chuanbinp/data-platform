version: 2

models:
  - name: weather_observation_history
    description: All collected station observation revisions, with collection-time knowledge intervals.
    data_tests:
      - unique_grain:
          arguments:
            columns: [location, station_id, period, ingestion_run_id]
      - unique_grain:
          arguments:
            columns: [location, station_id, period]
          config:
            where: "known_until is null"
  - name: weather_forecast_hourly_history
    description: All collected hourly forecast revisions. Source update time is retained separately from collection-time knowledge intervals.
    data_tests:
      - unique_grain:
          arguments:
            columns: [location, station_id, period, ingestion_run_id]
      - unique_grain:
          arguments:
            columns: [location, station_id, period]
          config:
            where: "known_until is null"
  - name: electricity_demand_hourly_history
    description: All demand revisions per hour and respondent. Knowledge intervals are inclusive at known_from and exclusive at known_until; NULL means current.
    data_tests:
      - unique_grain:
          arguments:
            columns: [period, respondent, ingestion_run_id]
      - unique_grain:
          arguments:
            columns: [period, respondent]
          config:
            where: "known_until is null"
  - name: electricity_demand_forecast_hourly_history
    description: All demand forecast revisions per hour and respondent. Knowledge intervals are inclusive at known_from and exclusive at known_until; NULL means current.
    data_tests:
      - unique_grain:
          arguments:
            columns: [period, respondent, ingestion_run_id]
      - unique_grain:
          arguments:
            columns: [period, respondent]
          config:
            where: "known_until is null"
  - name: electricity_net_generation_hourly_history
    description: All net generation revisions per hour and respondent. Knowledge intervals are inclusive at known_from and exclusive at known_until; NULL means current.
    data_tests:
      - unique_grain:
          arguments:
            columns: [period, respondent, ingestion_run_id]
      - unique_grain:
          arguments:
            columns: [period, respondent]
          config:
            where: "known_until is null"
  - name: electricity_total_interchange_hourly_history
    description: All total interchange revisions per hour and respondent. Knowledge intervals are inclusive at known_from and exclusive at known_until; NULL means current.
    data_tests:
      - unique_grain:
          arguments:
            columns: [period, respondent, ingestion_run_id]
      - unique_grain:
          arguments:
            columns: [period, respondent]
          config:
            where: "known_until is null"
  - name: generation_by_fuel_hourly_history
    description: One row per hour, respondent, fuel, and vintage, with collection-time knowledge intervals and original provenance.
    data_tests:
      - unique_grain:
          arguments:
            columns: [period, respondent, fueltype, ingestion_run_id]
      - unique_grain:
          arguments:
            columns: [period, respondent, fueltype]
          config:
            where: "known_until is null"
